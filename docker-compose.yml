services:
  backend:
    build: ./backend
    container_name: ${PROJECT_USER}-backend
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ${PROJECT_USER}-frontend
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend